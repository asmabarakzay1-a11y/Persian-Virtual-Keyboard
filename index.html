
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persian Virtual Keyboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="keyboard-container">

        <header class="header">
            <div class="logo">⌨</div>

            <div>
                <h1>Persian Keyboard</h1>
                <p>کیبورد مجازی فارسی</p>
            </div>

            <span class="status">
                <span class="status-dot"></span>
                آماده تایپ
            </span>
        </header>

        <section class="typing-area">

            <div class="input-header">
                <label for="textInput">متن شما</label>
                <span>فارسی | FA</span>
            </div>

            <input
                type="text"
                id="textInput"
                placeholder="شروع به تایپ کنید..."
                autocomplete="off"
            >

            <div class="input-footer">
                <span>متن خود را با کیبورد مجازی بنویسید</span>
            </div>

        </section>

        <section class="keyboard">

            <div class="key-row numbers">

                <button class="key number">۱</button>
                <button class="key number">۲</button>
                <button class="key number">۳</button>
                <button class="key number">۴</button>
                <button class="key number">۵</button>
                <button class="key number">۶</button>
                <button class="key number">۷</button>
                <button class="key number">۸</button>
                <button class="key number">۹</button>
                <button class="key number">۰</button>

                <button class="key action backspace" data-action="backspace">
                    ⌫
                </button>

                <button class="key action clear" data-action="clear">
                    پاک
                </button>

            </div>

            <div class="key-row">
                <button class="key">ض</button>
                <button class="key">ص</button>
                <button class="key">ث</button>
                <button class="key">ق</button>
                <button class="key">ف</button>
                <button class="key">غ</button>
                <button class="key">ع</button>
                <button class="key">ه</button>
                <button class="key">خ</button>
                <button class="key">ح</button>
                <button class="key">ج</button>
                <button class="key">چ</button>
            </div>

            <div class="key-row">
                <button class="key">ش</button>
                <button class="key">س</button>
                <button class="key">ی</button>
                <button class="key">ب</button>
                <button class="key">ل</button>
                <button class="key">ا</button>
                <button class="key">ت</button>
                <button class="key">ن</button>
                <button class="key">م</button>
                <button class="key">ک</button>
                <button class="key">گ</button>
                <button class="key">و</button>
            </div>

            <div class="key-row bottom-row">
                <button class="key">ظ</button>
                <button class="key">ط</button>
                <button class="key">ز</button>
                <button class="key">ر</button>
                <button class="key">ذ</button>
                <button class="key">د</button>
                <button class="key">پ</button>
                <button class="key">ژ</button>
                <button class="key">،</button>
                <button class="key">.</button>

                <button class="key space" data-action="space">
                    <span>فاصله</span>
                    <small>SPACE</small>
                </button>
            </div>

        </section>

        <footer class="footer">
            <span>Persian Virtual Keyboard</span>
            <span>© 2026</span>
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
